name: build

on:
  pull_request:
    branches: ['series/*', 'main']
  push:
    branches: ['series/*', 'main']
    tags: ["v[0-9]+*"]

jobs:
  jvm-tests:
    name: JVM / scala ${{ matrix.scala.version }}, jdk ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]
        scala:
          - { version: "2.13", command: "scala-213" }
          - { version: "3", command: "scala-3" }

    env:
      CI: true

    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache ivy2
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-ivy-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache coursier (linux)
        if: contains(runner.os, 'linux')
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-coursier-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: ~/.sbt
          key: ${{ runner.os }}-sbt-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: sbt ci-jvm
        run: ./.github/scripts/exec-sbt-command
        env:
          SCALA_COMMAND: ${{ matrix.scala.command }}
          PLATFORM: ${{ matrix.java }}
          SBT_COMMAND: ci-jvm

      - name: sbt reactiveTests/test
        run: ./.github/scripts/exec-sbt-command
        env:
          SCALA_COMMAND: ${{ matrix.scala.command }}
          PLATFORM: ${{ matrix.java }}
          SBT_COMMAND: "reactiveTests/test"

  js-tests:
    name: JS / scala ${{ matrix.scala.version }}, jdk ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 17, scala: { version: "2.13", command: "scala-213" } }
          - { java: 17, scala: { version: "3", command: "scala-3" } }

    env:
      CI: true

    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache ivy2
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-ivy-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache coursier (linux)
        if: contains(runner.os, 'linux')
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-coursier-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: ~/.sbt
          key: ${{ runner.os }}-sbt-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: sbt ci-js
        run: |
          ./.github/scripts/exec-sbt-command
        env:
          SCALA_COMMAND: ${{ matrix.scala.command }}
          PLATFORM: ${{ matrix.java }}
          SBT_COMMAND: ci-js

  mima:
    name: Mima / scala ${{ matrix.scala.version }}, jdk ${{ matrix.java }}
    runs-on: ubuntu-24.04

    env:
      CI: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 17, scala: { version: "2.13", command: "scala-213" } }
          - { java: 17, scala: { version: "3", command: "scala-3" } }

    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache ivy2
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-ivy-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache coursier (linux)
        if: contains(runner.os, 'linux')
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-coursier-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: ~/.sbt
          key: ${{ runner.os }}-sbt-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: sbt mimaReportBinaryIssues
        run: |
          ./.github/scripts/exec-sbt-command
        env:
          SCALA_COMMAND: ${{ matrix.scala.command }}
          SBT_COMMAND: mimaReportBinaryIssues

  unidoc:
    name: Unidoc / scala ${{ matrix.scala.version }}, jdk ${{ matrix.java }}
    runs-on: ubuntu-24.04

    env:
      CI: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: 17, scala: { version: "2.13", command: "scala-213" } }
          - { java: 17, scala: { version: "3", command: "scala-3" } }

    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache ivy2
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-ivy-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache coursier (linux)
        if: contains(runner.os, 'linux')
        uses: actions/cache@v5
        with:
          path: ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-coursier-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Cache sbt
        uses: actions/cache@v5
        with:
          path: ~/.sbt
          key: ${{ runner.os }}-sbt-cache-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: sbt unidoc
        run: |
          ./.github/scripts/exec-sbt-command
        env:
          SCALA_COMMAND: ${{ matrix.scala.command }}
          SBT_COMMAND: unidoc

  all_tests:
    name: All Tests
    if: always()
    needs: [ jvm-tests, js-tests, mima, unidoc ]
    runs-on: ubuntu-24.04
    steps:
    - name: Validate required tests
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}

