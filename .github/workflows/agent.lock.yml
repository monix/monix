name: "Monix Agent"
on:
  issue_comment:
    types:
      - created
      - edited
  issues:
    types:
      - opened
      - edited
      - reopened
  pull_request_review_comment:
    types:
      - created
      - edited
# roles: # Roles processed as role check in pre-activation job
# - admin # Roles processed as role check in pre-activation job
# - maintainer # Roles processed as role check in pre-activation job
# - write # Roles processed as role check in pre-activation job

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: "gh-aw-${{ github.workflow }}-${{ contains(github.actor, '[bot]') && github.run_id || github.event.issue.number || github.event.pull_request.number || github.run_id }}"
  queue: max

run-name: "Monix Agent"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.agent
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Monix%20Agent,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=pi'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

jobs:
  activation:
    name: activation
    needs: pre_activation
    if: "needs.pre_activation.outputs.activated == 'true' && ((github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository) && ((github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') && (github.event_name == 'issues' && (startsWith(github.event.issue.body, '/agent ') || startsWith(github.event.issue.body, '/agent\n') || startsWith(github.event.issue.body, '/agent\r') || github.event.issue.body == '/agent') || github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/agent ') || startsWith(github.event.comment.body, '/agent\n') || startsWith(github.event.comment.body, '/agent\r') || github.event.comment.body == '/agent') && github.event.issue.pull_request == null || github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/agent ') || startsWith(github.event.comment.body, '/agent\n') || startsWith(github.event.comment.body, '/agent\r') || github.event.comment.body == '/agent') && github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' && (startsWith(github.event.comment.body, '/agent ') || startsWith(github.event.comment.body, '/agent\n') || startsWith(github.event.comment.body, '/agent\r') || github.event.comment.body == '/agent')) || !(github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')))"
    runs-on: ubuntu-slim
    # Permissions for the activation job (workflow permissions default to none).
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      aw_context: ${{ steps.generate_aw_info.outputs.aw_context }}
      body: ${{ steps.sanitized.outputs.body }}
      comment_id: ${{ steps.add-comment.outputs.comment-id }}
      comment_repo: ${{ steps.add-comment.outputs.comment-repo }}
      comment_url: ${{ steps.add-comment.outputs.comment-url }}
      daily_ai_credits_estimated: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_estimated || '' }}
      daily_ai_credits_exceeded: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_exceeded == 'true' }}
      daily_ai_credits_guardrail_error: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_guardrail_error || '' }}
      daily_ai_credits_guardrail_status: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_guardrail_status || '' }}
      daily_ai_credits_threshold: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_threshold || '' }}
      daily_ai_credits_total: ${{ steps.daily-ai-credits-workflow-guardrail.outputs.daily_ai_credits_total || '' }}
      engine_id: ${{ steps.generate_aw_info.outputs.engine_id }}
      lockdown_check_failed: ${{ steps.generate_aw_info.outputs.lockdown_check_failed == 'true' }}
      model: ${{ steps.generate_aw_info.outputs.model }}
      oauth_token_check_failed: ${{ steps.check-oauth-tokens.outputs.oauth_token_check_failed == 'true' }}
      secret_verification_result: ${{ steps.validate-secret.outputs.verification_result }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      slash_command: ${{ needs.pre_activation.outputs.matched_command }}
      stale_lock_file_failed: ${{ steps.check-lock-file.outputs.stale_lock_file_failed == 'true' }}
      text: ${{ steps.sanitized.outputs.text }}
      title: ${{ steps.sanitized.outputs.title }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@7a073567000cd18a81b85d31527ac08d414c9599 # v0.91.7
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.pre_activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.pre_activation.outputs.setup-parent-span-id || needs.pre_activation.outputs.setup-span-id }}
          safe-output-artifact-client: ${{ env.GH_AW_MAX_DAILY_AI_CREDITS != '' }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Monix Agent"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/agent.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.0"
          GH_AW_INFO_AWF_VERSION: "v0.28.50"
          GH_AW_INFO_ENGINE_ID: "pi"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Generate agentic run info
        id: generate_aw_info
        env:
          GH_AW_INFO_ENGINE_ID: "pi"
          GH_AW_INFO_ENGINE_NAME: "Pi"
          GH_AW_INFO_MODEL: "deepseek/deepseek-flash"
          GH_AW_INFO_VERSION: "1.0.0"
          GH_AW_INFO_AGENT_VERSION: "1.0.0"
          GH_AW_INFO_CLI_VERSION: "v0.91.7"
          GH_AW_INFO_WORKFLOW_NAME: "Monix Agent"
          GH_AW_INFO_EXPERIMENTAL: "false"
          GH_AW_INFO_SUPPORTS_TOOLS_ALLOWLIST: "true"
          GH_AW_INFO_STAGED: "false"
          GH_AW_INFO_ALLOWED_DOMAINS: '["defaults","github","java","scala","api.deepseek.com","repo.maven.apache.org"]'
          GH_AW_INFO_FIREWALL_ENABLED: "true"
          GH_AW_INFO_AWF_VERSION: "v0.28.50"
          GH_AW_INFO_AWMG_VERSION: ""
          GH_AW_INFO_FIREWALL_TYPE: "squid"
          GH_AW_INFO_AGENT_RUNTIME: ""
          GH_AW_COMPILED_STRICT: "true"
          GH_AW_INFO_MODEL_COSTS: '{"providers":{"openai":{"models":{"deepseek-flash":{"cost":{"cache_read":"6e-9","input":"3e-7","output":"1.2e-6"}}}}}}'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
